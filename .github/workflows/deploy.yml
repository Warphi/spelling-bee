name: Deploy Spelling Bee

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # NYT publishes ~3am ET; cover EDT (07:00 UTC) and EST (08:00 UTC) plus a midday catch-up.
    - cron: "10 7 * * *"
    - cron: "10 8 * * *"
    - cron: "10 13 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Scrape today's puzzle
        run: node scripts/scrape.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
